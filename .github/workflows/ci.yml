name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build & self-checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          /usr/bin/xcodebuild -version || true
          sw_vers

      - name: Verify localisation coverage
        run: python3 scripts/check-localization.py

      - name: Build (debug)
        run: |
          set -o pipefail
          if ! swift build --disable-sandbox 2>&1 | tee build.log; then
            ERRORS="$(grep -nE '(^|: )(error:|fatal error:)' build.log | head -20 || true)"
            echo "::error::Build failed:%0A${ERRORS//$'\n'/%0A}"
            echo "::group::Build log tail"
            tail -n 40 build.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Run self-checks
        run: |
          set -o pipefail
          if ! swift run --disable-sandbox TaugeChecks 2>&1 | tee selfcheck.log; then
            FAILS="$(grep -nE '(^FAIL|^Fatal|error:)' selfcheck.log | head -25 || true)"
            TAIL="$(tail -n 20 selfcheck.log)"
            echo "::error::Self-checks failed:%0A${FAILS//$'\n'/%0A}%0A${TAIL//$'\n'/%0A}"
            echo "::group::Self-check log tail"
            printf '%s\n' "$TAIL"
            echo "::endgroup::"
            exit 1
          fi

      - name: Assemble app bundle
        run: ./scripts/build-app.sh release

      - name: Verify bundle
        run: |
          set -euo pipefail
          fail() { echo "::error::Verify bundle: $*"; exit 1; }
          test -d dist/Tauge.app || fail "dist/Tauge.app is missing"
          test -x dist/Tauge.app/Contents/MacOS/Tauge || fail "main executable is missing"
          EN_JSON="$(find dist/Tauge.app/Contents/Resources -name en.json -print -quit)"
          if [ -z "$EN_JSON" ]; then
            echo "::group::Bundle resource tree"
            find dist/Tauge.app/Contents/Resources -maxdepth 5 -print
            echo "::endgroup::"
            fail "en.json is missing from the resource bundle"
          fi
          echo "en.json: $EN_JSON"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Tauge.app/Contents/Info.plist             || fail "Info.plist has no CFBundleShortVersionString"
          if ! codesign --verify --verbose=1 dist/Tauge.app; then
            codesign -dvvv dist/Tauge.app || true
            fail "codesign --verify rejected the app"
          fi
          lipo -archs dist/Tauge.app/Contents/MacOS/Tauge || fail "lipo could not read the executable"
          if ! dist/Tauge.app/Contents/MacOS/Tauge --verify-localization; then
            echo "::group::Bundle resource tree"
            find dist/Tauge.app/Contents/Resources -maxdepth 5 -print
            echo "::endgroup::"
            fail "the packaged app cannot load its localisation table"
          fi
