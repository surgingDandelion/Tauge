name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build & self-checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          /usr/bin/xcodebuild -version || true
          sw_vers

      - name: Verify localisation coverage
        run: python3 scripts/check-localization.py

      - name: Build (debug)
        run: |
          set -o pipefail
          if ! swift build --disable-sandbox 2>&1 | tee build.log; then
            ERRORS="$(grep -nE '(^|: )(error:|fatal error:)' build.log | head -20 || true)"
            echo "::error::Build failed:%0A${ERRORS//$'\n'/%0A}"
            echo "::group::Build log tail"
            tail -n 40 build.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Run self-checks
        run: |
          set -o pipefail
          if ! swift run --disable-sandbox ShellXChecks 2>&1 | tee selfcheck.log; then
            FAILS="$(grep -nE '(^FAIL|^Fatal|error:)' selfcheck.log | head -25 || true)"
            TAIL="$(tail -n 20 selfcheck.log)"
            echo "::error::Self-checks failed:%0A${FAILS//$'\n'/%0A}%0A${TAIL//$'\n'/%0A}"
            echo "::group::Self-check log tail"
            printf '%s\n' "$TAIL"
            echo "::endgroup::"
            exit 1
          fi

      - name: Assemble app bundle
        run: ./scripts/build-app.sh release

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -d dist/Tauge.app
          test -f dist/Tauge.app/Contents/Resources/ShellX_ShellXKit.bundle/Contents/Resources/en.json
          test -x dist/Tauge.app/Contents/MacOS/Tauge
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Tauge.app/Contents/Info.plist
          codesign --verify --verbose=1 dist/Tauge.app
          lipo -archs dist/Tauge.app/Contents/MacOS/Tauge
