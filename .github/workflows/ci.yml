name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build & self-checks
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          /usr/bin/xcodebuild -version || true
          sw_vers

      - name: Verify localisation coverage
        run: python3 scripts/check-localization.py

      - name: Build (debug)
        run: swift build --disable-sandbox

      - name: Run self-checks
        run: swift run --disable-sandbox ShellXChecks

      - name: Assemble app bundle
        run: ./scripts/build-app.sh release

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -d dist/Tauge.app
          test -f dist/Tauge.app/Contents/Resources/ShellX_ShellXKit.bundle/en.json
          test -x dist/Tauge.app/Contents/MacOS/Tauge
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Tauge.app/Contents/Info.plist
          codesign --verify --verbose=1 dist/Tauge.app
          lipo -archs dist/Tauge.app/Contents/MacOS/Tauge
