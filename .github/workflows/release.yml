name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarise and publish
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Verify tag matches Info.plist
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "plist=$VERSION tag=$TAG"
          test "$VERSION" = "$TAG"

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "TAUGE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TAUGE_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package release
        env:
          TAUGE_ARCHS: arm64 x86_64
          TAUGE_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          TAUGE_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAUGE_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/package-release.sh

      - name: Summarise artifacts
        run: |
          set -euo pipefail
          cat dist/release/SHA256SUMS.txt
          codesign -dv --verbose=4 dist/Tauge.app 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier' || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tauge-${{ github.ref_name }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
