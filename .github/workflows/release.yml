name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarise and publish
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Verify tag matches Info.plist
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "plist=$VERSION tag=$TAG"
          test "$VERSION" = "$TAG"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no non-empty section for {version}")
          pathlib.Path("release-notes.md").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )
          PY

          {
            printf '**Tauge %s**：macOS 本地 SSH / SFTP 客户端。\n\n' "$GITHUB_REF_NAME"
            printf '%s\n\n' '## 更新日志'
            cat release-notes.md
            printf '\n%s\n\n' '## 安装'
            printf '1. 下载并打开 `Tauge-*.dmg`，将 **Tauge** 拖到「应用程序」文件夹。\n'
            printf '2. 启动 Tauge。应用数据保存在本机，无需注册账号。\n\n'
            printf '安装包需要搭载 Apple 芯片的 Mac，系统版本为 macOS 13 或更新版本。可用 `shasum -a 256 -c SHA256SUMS.txt` 校验 DMG 和 ZIP。\n\n'
            printf '搭载 Intel 芯片的 Mac 请继续使用 v1.2.7。旧版应用可能仍会显示更新提示。\n\n'
            printf '未配置 Developer ID 时，发布包使用临时签名。如果 macOS 阻止首次启动，请参阅[安装说明](https://github.com/%s/blob/main/docs/INSTALL.md)。\n\n' "$GITHUB_REPOSITORY"
            printf '[完整更新日志](https://github.com/%s/blob/main/CHANGELOG.md)\n' "$GITHUB_REPOSITORY"
          } > release-body.md

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "TAUGE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TAUGE_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package release
        env:
          TAUGE_SIGN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAUGE_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          TAUGE_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAUGE_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/package-release.sh

      # v1.2.8 is the only released updater that requires the old suffixed name.
      - name: Include the v1.2.8 update alias
        if: github.ref_name == 'v1.2.9'
        working-directory: dist/release
        run: |
          set -euo pipefail
          cp Tauge-1.2.9.zip Tauge-1.2.9-arm64.zip
          shasum -a 256 Tauge-1.2.9-arm64.zip >> SHA256SUMS.txt

      - name: Summarise artifacts
        run: |
          set -euo pipefail
          cat dist/release/SHA256SUMS.txt
          codesign -dv --verbose=4 dist/Tauge.app 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier' || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tauge-${{ github.ref_name }}
          path: |
            dist/release/*.dmg
            dist/release/Tauge-*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.dmg
            dist/release/Tauge-*.zip
            dist/release/SHA256SUMS.txt
          body_path: release-body.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
